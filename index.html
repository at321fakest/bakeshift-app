<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#16121f">
  <title>Bakeshift</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&text=BAKESHIFT&display=swap">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    html, body { margin: 0; height: 100%; background: #16121f; overflow: hidden; }
    /* Normal-flow iframe (not position:fixed, no viewport-fit=cover): fixed/edge-to-edge frames
       make Chrome on Android misplace taps and text selection by about the status-bar height. */
    iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; }
    .splash {
      position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: #16121f; color: #a7a1bd; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: opacity .3s;
    }
    .splash img { width: 96px; height: 96px; border-radius: 22px; }
    .splash .word {
      font: 800 26px "Unbounded", -apple-system, sans-serif; letter-spacing: .08em; color: transparent; -webkit-background-clip: text; background-clip: text;
      background: linear-gradient(115deg, #3cf2b4 0%, #b8f7a6 15%, #fbf3a0 27%, #ffc98f 40%, #ff8fa0 52%, #ff4fae 62%, #c04de6 75%, #7a5cff 87%, #1e90ff 100%);
      -webkit-background-clip: text; background-clip: text;
    }
    .splash a { color: #b197fc; font-weight: 600; margin-top: 24px; opacity: 0; transition: opacity .3s; }
    .splash.slow a { opacity: 1; }
    .splash.gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div class="splash" id="splash">
    <img src="icon-192.png" alt="">
    <div class="word">BAKESHIFT</div>
    <div>Opening your recipes…</div>
    <a id="direct" href="#">Stuck? Open Bakeshift directly</a>
  </div>
  <iframe id="app" title="Bakeshift" allow="clipboard-write; screen-wake-lock; camera"></iframe>
  <script>
    // The Bakeshift web app (Google Apps Script deployment). Only its owner can open it.
    var APP_URL = 'https://script.google.com/macros/s/AKfycbwuRSAV-WyqofqVqa6Z96a8lCQto4OKX0m7embbO4Zp6esMMUldhXZBIMrTKDDv3NuI/exec';

    // Android share sheet: "Share → Bakeshift" sends the page URL here (often inside "text").
    var params = new URLSearchParams(location.search);
    var shared = params.get('url') || ((params.get('text') || '').match(/https?:\/\/\S+/) || [])[0] || '';
    var src = APP_URL + (shared ? '?import=' + encodeURIComponent(shared) : '');
    if (shared) history.replaceState(null, '', './');

    var splash = document.getElementById('splash');
    var frame = document.getElementById('app');
    document.getElementById('direct').href = src;
    frame.addEventListener('load', function () {
      setTimeout(function () { splash.classList.add('gone'); }, 300);
      setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 700);
    });
    setTimeout(function () { splash.classList.add('slow'); }, 8000);
    frame.src = src;

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  </script>
</body>
</html>
